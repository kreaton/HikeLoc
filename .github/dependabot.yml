# Dependabot version updates (free for public and private repositories).
# Security updates and alerts are switched on in Settings > Advanced Security.
version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/HikeLoc"
      - "/HikeLoc.Core"
      - "/HikeLoc.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/video"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: ["minor", "patch"]
